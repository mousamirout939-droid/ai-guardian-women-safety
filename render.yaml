services:
  - type: web
    name: ai-guardian-women-safety
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PORT
        value: 8000
      - key: PUBLIC_APP_URL
        value: https://ai-guardian-women-safety.vercel.app
      - key: SOS_ESCALATION_DELAY_SECONDS
        value: 60
      - key: SOS_TRACKING_EXPIRY_HOURS
        value: 24
      - key: SOS_POLICE_HELPLINE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
